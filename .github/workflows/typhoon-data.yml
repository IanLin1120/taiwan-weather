name: 更新歷年颱風資料
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/typhoon_data.py', '.github/workflows/typhoon-data.yml']
permissions:
  contents: write
concurrency: typhoon-data
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/typhoon_data.py
      - name: commit
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add data/typhoon
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -qm "更新歷年颱風資料"
          git pull -q --rebase origin main && git push -q origin main
