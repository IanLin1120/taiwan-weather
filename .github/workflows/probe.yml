name: probe
on:
  push:
    branches: [data-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p out; B=https://rdc28.cwa.gov.tw/TDB
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          C="-sSL -A $UA -m 60 -c /tmp/ck -b /tmp/ck"
          curl -sSL -A "$UA" -m 60 -c /tmp/ck -b /tmp/ck $B/public/typhoon_list/ -o /dev/null
          for y in 2026 2025 1996; do curl -sSL -A "$UA" -m 60 -c /tmp/ck -b /tmp/ck -X POST -H "X-Requested-With: XMLHttpRequest" -H "Referer: $B/public/typhoon_list/" -d "year=$y" $B/public/typhoon_list/get_typhoon -o out/list_$y.json; done
          curl -sSL -A "$UA" -m 60 -c /tmp/ck -b /tmp/ck -X POST -H "X-Requested-With: XMLHttpRequest" -d "year=all" $B/public/typhoon_list/get_typhoon -o out/list_all.json
          ID=$(python3 -c "import json;print(json.load(open('out/list_2025.json'))[0]['id'])" || echo 202501)
          echo $ID > out/id.txt
          curl -sSL -A "$UA" -m 60 -c /tmp/ck -b /tmp/ck "$B/public/typhoon_detail?typhoon_id=$ID" -o out/detail.html
          for js in $(grep -oE 'src="[^"]+pages[^"]+\.js[^"]*"' out/detail.html | sed -E 's/^src="//;s/"$//'); do n=$(basename "${js%%\?*}"); curl -sSL -A "$UA" -m 60 "$js" -o "out/djs_$n"; done
          curl -sSL -A "$UA" -m 60 -c /tmp/ck -b /tmp/ck $B/public/warning_typhoon_list/ -o /dev/null
          curl -sSL -A "$UA" -m 60 -c /tmp/ck -b /tmp/ck -X POST -H "X-Requested-With: XMLHttpRequest" -d "year=2025" $B/public/warning_typhoon_list/get_typhoon -o out/wlist_2025.json
          ls -la out
      - name: save
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -b probe-out2; git add out; git commit -qm "probe output 2"; git push -f origin probe-out2
